<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CalmPulse</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="login.css">
    <style>
        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(24, 49, 14, 0.15);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="squares">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="nav">
        <img src="images/logo.png" alt="CalmPulse Logo">
        <div class="nav-right">
            <a href="index.html">Home</a>
            <a href="Aboutus.html">About Us</a>
            <a href="working.html">How it Works</a>
            <a href="faq.html">FAQ</a>
            <a href="signup.html">Sign Up</a>
            <a class="active" href="signin.html">Sign In</a>
        </div>
    </div> 

    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="auth-card p-4 p-md-5">
            <div class="text-center mb-4">
                <img src="images/logo.png" alt="CalmPulse Logo" style="height: 60px;" class="mb-2">
                <h2 class="fw-bold" style="color: #18310e;">Sign In</h2>
                <p class="text-muted small">Enter your credentials to access your CalmPulse account</p>
            </div>

            <!-- Error Notification Alert -->
            <div id="signin-alert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
                <span id="signin-alert-msg"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form id="signinForm">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-success"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-success"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm mb-3" id="signin-btn">
                    <span class="spinner-border spinner-border-sm me-2 d-none" id="signin-spinner"></span>
                    Sign In
                </button>
            </form>

            <div class="text-center mt-3">
                <p class="text-muted mb-0">New user? <a href="signup.html" class="text-success fw-bold text-decoration-none">Create an Account</a></p>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api-config.js"></script>
    <script src="auth-helper.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const BASE_URL = window.getApiBaseUrl();
        const form = document.getElementById("signinForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const alertBox = document.getElementById("signin-alert");
        const alertMsg = document.getElementById("signin-alert-msg");
        const submitBtn = document.getElementById("signin-btn");
        const spinner = document.getElementById("signin-spinner");

        function showError(msg) {
            alertMsg.textContent = msg;
            alertBox.classList.remove("d-none");
        }

        form.addEventListener("submit", async function (e) {
            e.preventDefault();
            alertBox.classList.add("d-none");

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showError("Please fill in both email and password.");
                return;
            }

            submitBtn.disabled = true;
            spinner.classList.remove("d-none");

            try {
                const res = await fetch(`${BASE_URL}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    throw new Error(data.message || data.error || "Invalid credentials or login failed.");
                }

                if (data.userId || data.user_id) {
                    localStorage.setItem("user_id", String(data.userId || data.user_id));
                }

                if (data.role) localStorage.setItem("mode", data.role);
                localStorage.setItem("is_new_user", String(data.isNewUser !== false && data.is_new_user !== false));

                // Clear cached user session so loadCurrentUser re-syncs
                sessionStorage.removeItem("cached_user_profile");

                // Immediately load current user state
                const user = await window.loadCurrentUser(true);

                if (data.isNewUser || data.is_new_user || (user && user.isNewUser)) {
                    window.location.href = "dashboard.html";
                } else {
                    window.location.href = "dashboard.html";
                }
            } catch (err) {
                console.error("Sign-in error:", err);
                showError(err.message || "Sign-in failed. Please check your connection and try again.");
            } finally {
                submitBtn.disabled = false;
                spinner.classList.add("d-none");
            }
        });
    });
    </script>
</body>
</html>
