<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CalmPulse</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="login.css">
    <style>
        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(24, 49, 14, 0.15);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="squares">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="nav">
        <img src="images/logo.png" alt="CalmPulse Logo">
        <div class="nav-right">
            <a href="index.html">Home</a>
            <a href="Aboutus.html">About Us</a>
            <a href="working.html">How it Works</a>
            <a href="faq.html">FAQ</a>
            <a class="active" href="signup.html">Sign Up</a>
            <a href="signin.html">Sign In</a>
        </div>
    </div> 

    <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="auth-card p-4 p-md-5">
            <div class="text-center mb-4">
                <img src="images/logo.png" alt="CalmPulse Logo" style="height: 60px;" class="mb-2">
                <h2 class="fw-bold" style="color: #18310e;">Create Account</h2>
                <p class="text-muted small">Start your stress-free mental wellness journey today</p>
            </div>

            <!-- Error Notification Alert -->
            <div id="signup-alert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
                <span id="signup-alert-msg"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form id="signupForm">
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label for="firstname" class="form-label fw-semibold">First Name</label>
                        <input type="text" class="form-control" id="firstname" required placeholder="First name">
                    </div>
                    <div class="col-6">
                        <label for="lastname" class="form-label fw-semibold">Last Name</label>
                        <input type="text" class="form-control" id="lastname" required placeholder="Last name">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="mobile" class="form-label fw-semibold">Contact Number</label>
                    <input type="tel" class="form-control" id="mobile" required placeholder="10-digit mobile number" pattern="^[0-9]{10}$">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password" required placeholder="At least 8 chars, mixed case & numbers" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$" title="At least 8 chars, include uppercase, lowercase, number & special char">
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm mb-3" id="signup-btn">
                    <span class="spinner-border spinner-border-sm me-2 d-none" id="signup-spinner"></span>
                    Register & Continue
                </button>
            </form>

            <div class="text-center mt-3">
                <p class="text-muted mb-0">Already have an account? <a href="signin.html" class="text-success fw-bold text-decoration-none">Sign In</a></p>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api-config.js"></script>
    <script src="auth-helper.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const BASE_URL = window.getApiBaseUrl();
        const form = document.getElementById("signupForm");
        const fnameInput = document.getElementById("firstname");
        const lnameInput = document.getElementById("lastname");
        const mobileInput = document.getElementById("mobile");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const alertBox = document.getElementById("signup-alert");
        const alertMsg = document.getElementById("signup-alert-msg");
        const submitBtn = document.getElementById("signup-btn");
        const spinner = document.getElementById("signup-spinner");

        function showError(msg) {
            alertMsg.textContent = msg;
            alertBox.classList.remove("d-none");
        }

        form.addEventListener("submit", async function (e) {
            e.preventDefault();
            alertBox.classList.add("d-none");

            const fname = fnameInput.value.trim();
            const lname = lnameInput.value.trim();
            const contact = mobileInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!fname || !lname || !contact || !email || !password) {
                showError("Please fill out all required fields.");
                return;
            }
            if (!/^[0-9]{10}$/.test(contact)) {
                showError("Please enter a valid 10-digit mobile number.");
                return;
            }

            submitBtn.disabled = true;
            spinner.classList.remove("d-none");

            try {
                const res = await fetch(`${BASE_URL}/auth/signup`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        first_name: fname,
                        last_name: lname,
                        contact: contact,
                        email: email,
                        password: password,
                        role: "student"
                    })
                });

                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.message || data.error || "Registration failed on server.");
                }

                alert("Registration successful! Please sign in to complete your profile.");
                window.location.href = "signin.html";
            } catch (err) {
                console.error("Sign-up error:", err);
                showError(err.message || "Registration failed. Email may already be in use.");
            } finally {
                submitBtn.disabled = false;
                spinner.classList.add("d-none");
            }
        });
    });
    </script>
</body>
</html>
